# Offending check rows that are gaps in NBA.com's own data, not bugs in this pipeline.
#
# A row listed here no longer fails its check, but it is still reported: the check prints how many
# known rows it saw, they're written to data/dq/<check>.known.csv, and meta.dq_results.n_known counts them.
# An entry matches only when EVERY column given in `row` has exactly that value, so if NBA.com
# changes the data (fixes it, or it gets worse) the row shows up as a normal failure again.
# If a listed gap stops appearing at all, the check run says so: the entry can then be deleted.
#
# Before adding an entry: re-run the pull for that season (it retries what failed) and confirm
# NBA.com still answers the same way.

